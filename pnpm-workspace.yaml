packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# pnpm 10 blocks dependency build scripts unless allow-listed; wrangler's
# workerd and esbuild need theirs to verify their platform binaries, and the
# storefront's own list (upstream's pnpm-workspace.yaml) adds the rest.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - protobufjs
  - sharp
  - workerd

# The storefront's ESLint 8 config (packages/eslint-config-catalyst) loads
# its plugins by name from the workspace root, as upstream hoists them.
publicHoistPattern:
  - "@bigcommerce/eslint-*"
  - "@next/eslint-*"
  - "@stylistic/eslint-*"
  - "@typescript-eslint/*"
  - eslint-config-*
  - eslint-plugin-*

# The storefront's lint config (@bigcommerce/eslint-config 2.11) is written
# against typescript-eslint 8.28, the version upstream's lockfile holds; a
# newer one brings rules its sources were never linted with.
overrides:
  "@typescript-eslint/eslint-plugin": 8.28.0
  "@typescript-eslint/parser": 8.28.0
